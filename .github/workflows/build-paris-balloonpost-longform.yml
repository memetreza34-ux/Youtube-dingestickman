name: Build Paris Balloonpost Longform

on:
  push:
    branches:
      - video/paris-ballonpost-1870-longform

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video/paris-ballonpost-1870-longform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Szene und Metadaten aus Script-first-Plan erzeugen
        run: node youtube/2026-KW41_05-10_bis_11-10/paris-ballonpost-1870/99-technik/generate-longform-plan.mjs
      - name: Flow Compiler bauen
        run: npm run build:youtube-flow -- --dir "youtube/2026-KW41_05-10_bis_11-10/paris-ballonpost-1870"
      - name: Phase 1 vollständig prüfen
        run: npm run validate:youtube-phase1 -- --dir "youtube/2026-KW41_05-10_bis_11-10/paris-ballonpost-1870"
      - name: Generierte Dateien commiten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube/2026-KW41_05-10_bis_11-10/paris-ballonpost-1870
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Generiere Pariser Ballonpost Longform"
            git push origin HEAD:video/paris-ballonpost-1870-longform
          fi
