name: Build Great Fire Longform

on:
  push:
    branches:
      - video/great-fire-london-1666-longform

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: video/great-fire-london-1666-longform
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scene Cards und Projektdateien erzeugen
        run: node youtube/2026-KW41_05-10_bis_11-10/great-fire-london-1666/99-technik/generate-longform-plan.mjs
      - name: Flow Prompt mit Repo-Compiler bauen
        run: npm run build:youtube-flow -- --dir "youtube/2026-KW41_05-10_bis_11-10/great-fire-london-1666"
      - name: Vollständige Phase 1 validieren
        run: npm run validate:youtube-phase1 -- --dir "youtube/2026-KW41_05-10_bis_11-10/great-fire-london-1666"
      - name: Generierte Longform-Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube/2026-KW41_05-10_bis_11-10/great-fire-london-1666
          if git diff --cached --quiet; then
            echo "Keine generierten Änderungen."
          else
            git commit -m "Generiere 84-Bild-Longform und Flow-Prompt"
            git push origin HEAD:video/great-fire-london-1666-longform
          fi
